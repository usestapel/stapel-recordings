[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-recordings"
version = "0.20.1"
description = "Recording lifecycle and transcription for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "recordings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # >=0.15.10 for stapel_core.hashing — transcript_schema imports it at module
    # level, so an older core is an ImportError at startup, not a missing feature.
    # Floor: 0.26.0 emits docs/errors.json with the `owner` field the
    # committed artifact and its drift gate require.
    "stapel-core>=0.26.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-recordings"
Repository = "https://github.com/usestapel/stapel-recordings"
Documentation = "https://github.com/usestapel/stapel-recordings#readme"
Changelog = "https://github.com/usestapel/stapel-recordings/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-recordings/issues"

[project.optional-dependencies]
# S3/MinIO storage backend (stapel_recordings.storage.S3Backend). The
# default DjangoStorageBackend needs no extra. Audio normalization
# (convert stage) additionally needs ffmpeg/ffprobe on PATH at runtime.
s3 = ["boto3>=1.34"]
# Opt-in vector/search layer: the stapel_recordings.vector Django app
# (SegmentEmbedding/RecordingEmbedding + hybrid search). Requires
# PostgreSQL with the pgvector extension at runtime; the base package
# works (and is tested) without this extra.
vector = ["pgvector>=0.3"]
# Question answering over transcripts (stapel_recordings.vector.qa). The
# one place in the package where stapel-agent is needed as a LIBRARY, not
# just a bus name: the prompt is built from untrusted text and must go
# through ``stapel_agent.safety.markers.sanitize_for_rag``. A separate
# extra so deployments that don't answer questions don't pull the agent in.
#
# Floor raised 0.8 -> 0.12.0: every delegated payload now carries
# user_id/workspace_id, and the llm.* schemas are additionalProperties:false,
# so an older agent REJECTS the call rather than ignoring the fields. This is
# the only place the floor can be enforced by a resolver — the bus names it
# otherwise reaches are versionless. Hosts on the base package get
# checks.W009 at boot instead, when the agent is in the same process.
qa = ["stapel-recordings[vector]", "stapel-agent>=0.12.0"]
all = ["stapel-recordings[s3,vector,qa]"]

[tool.setuptools]
package-dir = {"stapel_recordings" = "."}
packages = [
    "stapel_recordings",
    "stapel_recordings.migrations",
    "stapel_recordings.management",
    "stapel_recordings.management.commands",
    "stapel_recordings.vector",
    "stapel_recordings.vector.migrations",
]

[tool.setuptools.package-data]
# The error catalogs ship IN THE WHEEL, or the keys this module owns resolve
# to English everywhere they are read. `translations/.state.json` is listed
# separately: a leading dot is not matched by `translations/*.json`, and the
# provenance sidecar is what makes a downstream regeneration a no-op instead
# of a re-translation.
stapel_recordings = ["py.typed", "migrations/*.py", "vector/migrations/*.py", "schemas/**/*.json", "docs/capabilities.json", "docs/flows.json", "docs/errors.json", "docs/llms.txt", "CONFIG.MD", "translations/*.json", "translations/.state.json"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
